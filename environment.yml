# One environment for every stage. The heavy models are optional extras; see README "Install".
name: frolic
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python=3.10
  - pip
  - ffmpeg
  - numpy<2
  - scipy
  - pyyaml
  - pandas
  - pillow
  - pip:
      - torch>=2.1
      - roma>=1.4
      - opencv-python>=4.8
      - pydantic>=2.5
      - typer>=0.12
      - soundfile>=0.12
      - aniposelib>=0.8
      - rtmlib>=0.0.13
      - onnxruntime-gpu>=1.16
      - torchreid>=0.2.5
      - trimesh>=4
      - pyrender>=0.1.45
      - PyOpenGL==3.1.0
      - anny>=0.3
      - pytest>=8
      - pytest-cov>=5
      - ruff>=0.6
      - -e .
